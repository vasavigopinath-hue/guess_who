<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f86d4"/>
      <stop offset="0.6" stop-color="#6fbbef"/>
      <stop offset="1" stop-color="#a9dcf7"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <circle cx="620" cy="140" r="45"/><circle cx="680" cy="120" r="60"/><circle cx="750" cy="145" r="45"/><rect x="600" y="140" width="170" height="45" rx="22"/>
    <circle cx="1300" cy="230" r="90"/><circle cx="1420" cy="180" r="120"/><circle cx="1540" cy="230" r="95"/><circle cx="1220" cy="280" r="60"/><rect x="1180" y="250" width="440" height="100" rx="50"/>
    <circle cx="1450" cy="520" r="55"/><circle cx="1520" cy="490" r="75"/><rect x="1400" y="510" width="220" height="60" rx="30"/>
    <circle cx="120" cy="330" r="40"/><circle cx="175" cy="310" r="55"/><rect x="90" y="325" width="150" height="40" rx="20"/>
  </g>

  <!-- far hills -->
  <path d="M0 700 Q300 600 650 680 T1300 650 T1600 640 V1000 H0Z" fill="#8bcf6c"/>

  <!-- castle wall -->
  <g fill="#4b5f8f">
    <rect x="0" y="560" width="560" height="260"/>
    <rect x="0" y="530" width="40" height="40"/><rect x="80" y="530" width="40" height="40"/><rect x="160" y="530" width="40" height="40"/>
    <rect x="240" y="530" width="40" height="40"/><rect x="320" y="530" width="40" height="40"/><rect x="400" y="530" width="40" height="40"/><rect x="480" y="530" width="40" height="40"/>
    <rect x="180" y="440" width="150" height="140"/>
  </g>
  <rect x="215" y="660" width="80" height="120" rx="40" fill="#34446b"/>

  <!-- windmill -->
  <path d="M40 820 L75 470 L135 470 L170 820Z" fill="#e9e4d8"/>
  <path d="M60 470 L105 420 L150 470Z" fill="#a85b3c"/>
  <g transform="translate(105 470) rotate(20)" fill="#f4f1ea" stroke="#9a8f80" stroke-width="4">
    <rect x="-14" y="-250" width="28" height="230"/>
    <rect x="-14" y="20" width="28" height="230"/>
    <rect x="-250" y="-14" width="230" height="28"/>
    <rect x="20" y="-14" width="230" height="28"/>
  </g>
  <circle cx="105" cy="470" r="16" fill="#7a6a58"/>

  <!-- near hills and path -->
  <path d="M0 820 Q400 740 800 800 T1600 760 V1000 H0Z" fill="#5db54d"/>
  <path d="M0 900 Q300 860 520 900 T900 1000 H0Z" fill="#e6dcc4"/>
  <path d="M1000 1000 Q1200 880 1600 900 V1000Z" fill="#4aa040"/>

  <!-- bushes -->
  <g fill="#3e8f3a">
    <circle cx="40" cy="960" r="80"/><circle cx="1560" cy="930" r="90"/><circle cx="1470" cy="970" r="70"/>
  </g>
</svg>
