<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guess Who</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <button id="menu-btn" class="menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
    <span></span><span></span><span></span>
  </button>

  <button id="save-btn" class="save-btn" type="button" title="Save your boards to the website so they show on any device">
    <svg class="ic ic-save" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19H7a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 11 4 4 0 0 1 17.5 19z"/><path d="M12 12v6"/><path d="m9 15 3-3 3 3"/></svg>
    <svg class="ic ic-edit" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span id="save-label">Save</span>
  </button>

  <nav id="menu" class="menu" hidden>
    <div class="menu-label">Switch Board</div>
    <div id="board-list"></div>
    <button id="new-board" class="menu-item edit-only" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add new board</button>

    <hr>
    <div class="menu-label">This Board</div>
    <p class="menu-hint locked-only">This board is locked. Press <strong>Edit</strong> (top right) to add, delete or change things.</p>
    <label class="menu-item edit-only">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Add photos
      <input id="bulk-input" type="file" accept="image/*" multiple hidden>
    </label>
    <button id="reset" class="menu-item" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>Reset Board</button>
    <button id="bg-btn" class="menu-item edit-only" type="button" aria-expanded="false" aria-controls="swatches"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="6.5" r="1"/><circle cx="17.5" cy="10.5" r="1"/><circle cx="8.5" cy="7.5" r="1"/><circle cx="6.5" cy="12.5" r="1"/><path d="M12 2a10 10 0 0 0 0 20c1 0 1.6-.8 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.9.8-1.7 1.7-1.7h2a5.6 5.6 0 0 0 5.5-5.6C22 6 17.5 2 12 2z"/></svg>Background Color</button>
    <div id="swatches" class="swatches edit-only" hidden></div>
    <button id="rename-board" class="menu-item edit-only" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Rename Board</button>
    <button id="delete-board" class="menu-item danger edit-only" type="button"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>Delete Board</button>
  </nav>

  <header>

  </header>

  <main>
    <div id="board" class="board"></div>
  </main>

  <footer id="remaining" class="remaining" aria-live="polite"></footer>

  <input id="slot-input" type="file" accept="image/*" hidden>
  <div id="drop-hint" class="drop-hint">Drop photos to fill the empty slots</div>

  <script src="app.js"></script>
</body>
</html>
